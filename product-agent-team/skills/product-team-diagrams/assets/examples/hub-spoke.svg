  <rect class="card" x="170" y="175" width="260" height="70"/><text class="t" x="205" y="207">能力组 A</text><text class="p" x="205" y="228">短句说明</text>
  <rect class="card" x="170" y="415" width="260" height="70"/><text class="t" x="205" y="447">能力组 B</text><text class="p" x="205" y="468">短句说明</text>
  <rect class="card" x="770" y="175" width="260" height="70"/><text class="t" x="805" y="207">能力组 C</text><text class="p" x="805" y="228">短句说明</text>
  <rect class="card" x="770" y="415" width="260" height="70"/><text class="t" x="805" y="447">能力组 D</text><text class="p" x="805" y="468">短句说明</text>
