<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs><style>.bg{fill:#f7f8fb}.h1{font:700 30px Arial,"PingFang SC",sans-serif;fill:#20242c}.sub{font:400 17px Arial,"PingFang SC",sans-serif;fill:#667085}.hub{fill:#eef4ff;stroke:#2e6fed;stroke-width:3;rx:10}.card{fill:#fff;stroke:#d0d5dd;stroke-width:2;rx:8}.t{font:700 20px Arial,"PingFang SC",sans-serif;fill:#20242c}.p{font:400 15px Arial,"PingFang SC",sans-serif;fill:#475467}.line{stroke:#98a2b3;stroke-width:3}</style></defs>
  <rect class="bg" width="1200" height="675"/>
