  <line class="line" x1="600" y1="330" x2="300" y2="210"/><line class="line" x1="600" y1="330" x2="300" y2="450"/><line class="line" x1="600" y1="330" x2="900" y2="210"/><line class="line" x1="600" y1="330" x2="900" y2="450"/>
