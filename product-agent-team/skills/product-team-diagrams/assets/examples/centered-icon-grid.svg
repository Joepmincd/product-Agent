<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .bg{fill:#f7f8fb}
      .h1{font:700 30px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20242c}
      .sub{font:400 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .card{fill:#fff;stroke:#d0d5dd;stroke-width:1.5;rx:8}
      .iconbg{fill:#eef4ff;stroke:#84adff;stroke-width:1.5}
      .iconbg2{fill:#ecfdf3;stroke:#6ce9a6;stroke-width:1.5}
      .iconbg3{fill:#fff4ed;stroke:#fdb022;stroke-width:1.5}
      .iconbg4{fill:#f4f3ff;stroke:#bdb4fe;stroke-width:1.5}
      .t{font:700 20px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20242c;text-anchor:middle}
      .p{font:400 15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085;text-anchor:middle}
      .num{font:700 28px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20242c;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="h1" x="70" y="70">居中卡片模板：图标、指标、短标签场景</text>
  <text class="sub" x="70" y="104">适合能力概览、资源入口、指标摘要；图标、数字、标题和短说明全部居中</text>

  <rect class="card" x="120" y="175" width="220" height="260"/>
  <circle class="iconbg" cx="230" cy="245" r="34"/>
  <text class="num" x="230" y="255">1</text>
  <text class="t" x="230" y="328">能力卡片 A</text>
  <text class="p" x="230" y="366">一句话说明价值</text>
  <text class="p" x="230" y="392">短句保持居中</text>

  <rect class="card" x="370" y="175" width="220" height="260"/>
  <circle class="iconbg2" cx="480" cy="245" r="34"/>
  <text class="num" x="480" y="255">2</text>
  <text class="t" x="480" y="328">能力卡片 B</text>
  <text class="p" x="480" y="366">图标与文字中心对齐</text>
  <text class="p" x="480" y="392">不要随意左偏</text>

  <rect class="card" x="620" y="175" width="220" height="260"/>
  <circle class="iconbg3" cx="730" cy="245" r="34"/>
  <text class="num" x="730" y="255">3</text>
  <text class="t" x="730" y="328">能力卡片 C</text>
  <text class="p" x="730" y="366">卡片内容垂直居中</text>
  <text class="p" x="730" y="392">上下留白一致</text>

  <rect class="card" x="870" y="175" width="220" height="260"/>
  <circle class="iconbg4" cx="980" cy="245" r="34"/>
  <text class="num" x="980" y="255">4</text>
  <text class="t" x="980" y="328">能力卡片 D</text>
  <text class="p" x="980" y="366">同组卡片等宽等高</text>
  <text class="p" x="980" y="392">节奏一致</text>

  <rect class="card" x="230" y="490" width="740" height="58"/>
  <text class="t" x="600" y="526">默认规则：短内容居中，长列表左对齐</text>
</svg>
