  <defs><style>.bg{fill:#f7f8fb}.h1{font:700 30px Arial,"PingFang SC",sans-serif;fill:#20242c}.sub{font:400 17px Arial,"PingFang SC",sans-serif;fill:#667085}.lane{fill:#fff;stroke:#d0d5dd;stroke-width:2}.head{fill:#eef4ff;stroke:#d0d5dd;stroke-width:2}.t{font:700 19px Arial,"PingFang SC",sans-serif;fill:#20242c}.p{font:400 16px Arial,"PingFang SC",sans-serif;fill:#475467}.step{fill:#fff;stroke:#84adff;stroke-width:2;rx:8}.arr{stroke:#98a2b3;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#98a2b3"/></marker></defs>
