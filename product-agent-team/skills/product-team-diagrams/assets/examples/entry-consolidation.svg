<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .bg{fill:#f7f8fb}.h1{font:700 30px Arial,"PingFang SC",sans-serif;fill:#20242c}.sub{font:400 17px Arial,"PingFang SC",sans-serif;fill:#667085}.sec{font:700 22px Arial,"PingFang SC",sans-serif;fill:#20242c}.name{font:700 18px Arial,"PingFang SC",sans-serif;fill:#20242c}.txt{font:400 15px Arial,"PingFang SC",sans-serif;fill:#475467}.band{fill:#fff;stroke:#d0d5dd;stroke-width:2;rx:8}.card{fill:#fff;stroke:#98a2b3;stroke-width:2;rx:8}.hub{fill:#eef4ff;stroke:#2e6fed;stroke-width:3;rx:8}.scenario{fill:#fff;stroke:#84adff;stroke-width:2;rx:8}.arrow{stroke:#98a2b3;stroke-width:4;fill:none;marker-end:url(#a)}.blue{stroke:#2e6fed;stroke-width:4;fill:none;marker-end:url(#b)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#98a2b3"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e6fed"/></marker>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="h1" x="64" y="62">入口收敛图模板：旧入口统一到新入口</text>
  <text class="sub" x="64" y="96">适合讲清“当前分散 - 统一承接 - 按场景使用”</text>
  <rect class="band" x="60" y="132" width="330" height="430"/>
  <text class="sec" x="90" y="172">当前入口</text>
  <rect class="card" x="90" y="200" width="270" height="55"/><text class="name" x="112" y="225">入口 A</text><text class="txt" x="112" y="244">能力说明短句</text>
  <rect class="card" x="90" y="270" width="270" height="55"/><text class="name" x="112" y="295">入口 B</text><text class="txt" x="112" y="314">能力说明短句</text>
  <rect class="card" x="90" y="340" width="270" height="55"/><text class="name" x="112" y="365">入口 C</text><text class="txt" x="112" y="384">能力说明短句</text>
  <rect class="card" x="90" y="410" width="270" height="55"/><text class="name" x="112" y="435">更多入口</text><text class="txt" x="112" y="454">仅放已确认内容</text>
  <path class="arrow" d="M392 348 L500 348"/>
  <rect class="hub" x="500" y="255" width="240" height="185"/>
  <text class="h1" x="545" y="330">统一入口</text>
  <text class="sub" x="548" y="365">用户只记一个入口</text>
  <text class="txt" x="548" y="395">对外口径统一</text>
  <path class="blue" d="M742 348 L850 348"/>
  <rect class="band" x="850" y="132" width="290" height="430"/>
  <text class="sec" x="880" y="172">升级后场景</text>
  <rect class="scenario" x="880" y="205" width="230" height="48"/><text class="name" x="905" y="235">场景 1</text>
  <rect class="scenario" x="880" y="270" width="230" height="48"/><text class="name" x="905" y="300">场景 2</text>
  <rect class="scenario" x="880" y="335" width="230" height="48"/><text class="name" x="905" y="365">场景 3</text>
  <rect class="scenario" x="880" y="400" width="230" height="48"/><text class="name" x="905" y="430">更多场景</text>
</svg>
